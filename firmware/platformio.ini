; PlatformIO builds src_dir ONLY. A sketch folder that is not src_dir is
; invisible to it -- editing one and running `pio run` silently builds the
; other. That mistake cost this project a debugging session; see README.md.
;
; src_dir below points at the firmware that runs on the robot.
; To build the integration build instead, change it to hybridbot_fly.

[platformio]
src_dir = hybridbot

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	duracopter/MAVLink v2 C library@^2.0
	links2004/WebSockets@^2.7.3
